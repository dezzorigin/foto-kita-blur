  <text x="420" y="350" font-size="11" fill="#888888" text-anchor="middle">Tidak → kembali tajam (blur mati)</text>
  <text x="690" y="350" font-size="11" fill="#888888" text-anchor="middle">Ya → blur menyala</text>

  <text x="460" y="520" font-size="11" fill="#666666" text-anchor="middle">Semua pemrosesan di perangkat · Tidak ada upload · Tidak ada server</text>
