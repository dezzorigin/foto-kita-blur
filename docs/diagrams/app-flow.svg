    <text x="150" y="156" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">Navbar · Hero · Fitur</text>

    <rect x="330" y="110" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
    <text x="420" y="136" text-anchor="middle">Buka Kamera</text>
    <text x="420" y="156" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">getUserMedia (depan)</text>

    <rect x="600" y="110" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
    <text x="690" y="136" text-anchor="middle">Muat Model AI</text>
    <text x="690" y="156" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">MediaPipe · CDN · GPU</text>

    <rect x="60" y="260" width="180" height="64" rx="12" fill="#111111" stroke="#00F0FF"/>
    <text x="150" y="286" text-anchor="middle">Loop Tiap Frame</text>
    <text x="150" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">requestAnimationFrame</text>

    <rect x="330" y="260" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
    <text x="420" y="286" text-anchor="middle">Victory &gt; 0,55?</text>
    <text x="420" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">Peace sign ✌️ terdeteksi?</text>

    <rect x="600" y="260" width="180" height="64" rx="12" fill="#00F0FF"/>
    <text x="690" y="286" text-anchor="middle" fill="#000000">BLUR ACTIVE</text>
    <text x="690" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="#003338">Video blur 12px</text>

    <rect x="330" y="410" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
    <text x="420" y="436" text-anchor="middle">SNAP</text>
    <text x="420" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">Canvas → PNG download</text>

    <rect x="600" y="410" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
    <text x="690" y="436" text-anchor="middle">Recent Captures</text>
    <text x="690" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#999999">Galeri · unduh ulang</text>
  </g>

  <!-- arrows -->
  <g stroke="#00F0FF" stroke-width="2" fill="none">
    <path d="M240 142 H325"/>
    <path d="M510 142 H595"/>
    <path d="M690 174 V255"/>
    <path d="M600 292 H515"/>
    <path d="M420 324 V405"/>
    <path d="M510 442 H595"/>
