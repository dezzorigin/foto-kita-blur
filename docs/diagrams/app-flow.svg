    <path d="M595 137 L605 142 L595 147 Z"/>
    <path d="M685 255 L690 245 L695 255 Z"/>
    <path d="M515 287 L505 292 L515 297 Z"/>
    <path d="M415 405 L420 395 L425 405 Z"/>
