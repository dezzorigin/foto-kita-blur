<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="560" fill="#080808"/>
  <text x="460" y="44" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Foto Kita Blur — Alur Aplikasi</text>
  <text x="460" y="68" font-size="12" fill="#888888" text-anchor="middle">Landing → Kamera → Deteksi Gesture → Blur → SNAP</text>

  <!-- boxes -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <rect x="60" y="110" width="180" height="64" rx="12" fill="#111111" stroke="#262626"/>
